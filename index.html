<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nucleo — просто о коде</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- ИНТРО-ЗАСТАВКА -->
<div class="intro" id="intro">
  <div class="intro-inner">
    <div class="intro-atom">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="6" fill="#e6e4ec"/>
        <ellipse cx="50" cy="50" rx="38" ry="16" fill="none" stroke="#e6e4ec" stroke-width="2"/>
        <ellipse cx="50" cy="50" rx="38" ry="16" fill="none" stroke="#e6e4ec" stroke-width="2" transform="rotate(60 50 50)"/>
        <ellipse cx="50" cy="50" rx="38" ry="16" fill="none" stroke="#e6e4ec" stroke-width="2" transform="rotate(120 50 50)"/>
      </svg>
    </div>
    <div class="intro-title" id="introTitle">
      <span>n</span>
      <span>u</span>
      <span>c</span>
      <span>l</span>
      <span>e</span>
      <span>o</span>
    </div>
  </div>
</div>

<div class="app">

    <header class="top">
    <a class="brand" href="#" onclick="return false;">
      <span class="brand-mark">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="16" cy="16" r="3" fill="currentColor"/>
          <ellipse cx="16" cy="16" rx="12" ry="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <ellipse cx="16" cy="16" rx="12" ry="5" fill="none" stroke="currentColor" stroke-width="1.2" transform="rotate(60 16 16)"/>
          <ellipse cx="16" cy="16" rx="12" ry="5" fill="none" stroke="currentColor" stroke-width="1.2" transform="rotate(120 16 16)"/>
        </svg>
      </span>
      <span class="brand-text">nucleo</span>
    </a>
    <span class="top-note">справочник по коду</span>
  </header>

  <section class="hero" id="hero">
    <h1 class="hero-title">просто о коде</h1>
    <p class="hero-sub">впиши слово — объясню</p>

    <div class="search-wrap">
  <span class="search-caret">&gt;</span>
  <input type="text" class="search-input" id="searchInput"
         placeholder="html, flex, return..." autocomplete="off" autofocus>
  <button class="search-btn" id="searchBtn">найти</button>
  <div class="search-suggest" id="searchSuggest"></div>
</div>

    <div class="hints">
      <button class="hint" data-q="html">html</button>
      <button class="hint" data-q="css">css</button>
      <button class="hint" data-q="div">div</button>
      <button class="hint" data-q="flex">flex</button>
      <button class="hint" data-q="return">return</button>
      <button class="hint" data-q="map">map</button>
      <button class="hint" data-q="fetch">fetch</button>
    </div>
  </section>

  <section class="results" id="results"></section>

</div>

<script src="script.js"></script>
</body>
</html>
